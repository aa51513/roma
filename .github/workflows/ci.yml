name: ci
on: push
jobs:
  clippy_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install reviewdog
        run: curl -fsSL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh
      - name: Run Clippy with reviewdog
        run: cargo clippy --all-features --message-format=json | tee clippy-report.json | reviewdog -f=cargo -name="Clippy" -reporter=github-pr-review -filter-mode=file -fail-on-error
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
